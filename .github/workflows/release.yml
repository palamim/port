name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check VERSION matches tag
        # The tag drives the release/cask version; VERSION drives the
        # .app's embedded CFBundleShortVersionString (scripts/package.sh).
        # They're two separate files with no other link between them --
        # failing loudly here is cheaper than a release silently shipping
        # a binary whose own Info.plist disagrees with the tag it's
        # published under.
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag v${tag_version} does not match VERSION (${file_version}). Update VERSION and re-tag."
            exit 1
          fi
      - name: Package
        run: scripts/package.sh
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: Port.zip
          generate_release_notes: true

      - name: Bump Homebrew cask
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha="$(shasum -a 256 Port.zip | cut -d ' ' -f 1)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retried end-to-end (fetch through push), not just the push: if
          # two release tags land close together, the second job's push can
          # be rejected as non-fast-forward because the first already moved
          # main. Re-fetching and re-checking out FETCH_HEAD each attempt
          # discards the previous attempt's now-stale commit and rebuilds it
          # on top of whatever main is by then.
          attempt=1
          max_attempts=5
          while true; do
            # The tag build checks out a detached HEAD; commit onto main's
            # tip instead, so this can't push a branch that's behind.
            git fetch origin main
            git checkout -B main FETCH_HEAD

            # BSD sed (macos-14 runner) -- -i takes a mandatory backup suffix.
            sed -i '' \
              -e "s|^  version .*|  version \"${version}\"|" \
              -e "s|^  sha256 .*|  sha256 \"${sha}\"|" \
              Casks/port.rb

            if git diff --quiet -- Casks/port.rb; then
              echo "Cask already at ${version}, nothing to bump."
              exit 0
            fi

            git commit -m "cask: Port ${version}" -- Casks/port.rb

            if git push origin main; then
              exit 0
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Failed to push cask bump after ${max_attempts} attempts."
              exit 1
            fi

            echo "Push rejected (attempt ${attempt}/${max_attempts}), retrying..."
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
